<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorteo · Concurso del club 2026-2027</title>
    <script type="module" crossorigin src="./assets/index-B3e8I31G.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DyBZla61.css">
  </head>
  <body>
    <header class="cabecera">
      <div>
        <p class="cabecera__club">Toastmasters Pachuca · Concurso del club 2026-2027</p>
        <h1>Sorteo del orden de participación</h1>
      </div>
      <div class="cabecera__acciones">
        <button id="copiar" class="boton boton--claro" type="button">Copiar resultados</button>
        <button id="reiniciar-todo" class="boton boton--claro" type="button">Reiniciar todo</button>
      </div>
    </header>

    <nav id="pestanas" class="pestanas" aria-label="Categorías"></nav>

    <main class="escena">
      <section class="ruleta-zona" aria-live="polite">
        <div class="ruleta-marco">
          <div class="puntero" aria-hidden="true"></div>
          <svg id="ruleta" class="ruleta" viewBox="-205 -205 410 410" role="img" aria-label="Ruleta de concursantes"></svg>
          <button id="girar" class="girar" type="button">Girar</button>
        </div>
        <p id="estado" class="estado"></p>
      </section>

      <aside class="orden">
        <h2 id="orden-titulo"></h2>
        <p id="orden-nota" class="orden__nota"></p>
        <ol id="orden-lista" class="orden__lista"></ol>
        <div class="orden__acciones">
          <button id="deshacer" class="boton" type="button">Deshacer el último</button>
          <button id="reiniciar" class="boton" type="button">Reiniciar esta categoría</button>
        </div>
      </aside>
    </main>

    <div id="aviso" class="aviso" hidden>
      <div class="aviso__caja">
        <p id="aviso-lugar" class="aviso__lugar"></p>
        <div id="aviso-foto" class="aviso__foto"></div>
        <p id="aviso-nombre" class="aviso__nombre"></p>
        <button id="aviso-seguir" class="boton boton--fuerte" type="button">Continuar</button>
      </div>
    </div>

  </body>
</html>
